services:
  buienradar:
    build: .
    container_name: buienradar
    restart: unless-stopped
    environment:
      TZ: Europe/Amsterdam
    volumes:
      - fonts:/app/fonts   # keeps the downloaded Buienradar font across rebuilds
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.buienradar.rule=Host(`buienradar.matthiaz.dev`)
      - traefik.http.services.buienradar.loadbalancer.server.port=8000

volumes:
  fonts:

networks:
  proxy:
    name: proxy
    external: true
